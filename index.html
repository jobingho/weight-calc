<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="format-detection" content="telephone=no">
<meta property="og:title" content="重量计算器">
<meta property="og:description" content="老人专用重量计算器：填包数和每包重量，点计算即可得出千克重量，超过100自动按克换算。">
<meta property="og:type" content="website">
<title>重量计算器</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    padding: 24px 16px 60px;
    font-family: "Microsoft YaHei", "PingFang SC", "Heiti SC", sans-serif;
    background: #f4f6f8;
    color: #1a1a1a;
  }
  h1 {
    text-align: center;
    font-size: 40px;
    font-weight: 800;
    margin: 0 0 8px;
    color: #15315b;
  }
  .sub {
    text-align: center;
    font-size: 22px;
    color: #5a6b7b;
    margin: 0 0 32px;
  }
  .row {
    background: #ffffff;
    border: 2px solid #d4dce4;
    border-radius: 16px;
    padding: 22px 20px;
    margin: 0 auto 24px;
    max-width: 760px;
  }
  .row-title {
    font-size: 26px;
    font-weight: 700;
    color: #15315b;
    margin-bottom: 16px;
  }
  .inputs {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  .field {
    display: flex;
    flex-direction: column;
    flex: 1 1 200px;
  }
  .field label {
    font-size: 24px;
    font-weight: 600;
    margin-bottom: 8px;
  }
  input[type="number"] {
    width: 100%;
    font-size: 28px;
    padding: 14px 16px;
    border: 2px solid #b9c4cf;
    border-radius: 12px;
    background: #fff;
    color: #1a1a1a;
  }
  input[type="number"]:focus {
    outline: none;
    border-color: #2f6fed;
    box-shadow: 0 0 0 3px rgba(47,111,237,0.15);
  }
  .btn-group {
    display: flex;
    gap: 14px;
    align-self: flex-end;
    flex: 0 0 auto;
  }
  .calc-btn {
    font-size: 28px;
    font-weight: 700;
    color: #fff;
    background: #2f6fed;
    border: none;
    border-radius: 12px;
    padding: 16px 28px;
    cursor: pointer;
    min-width: 130px;
  }
  .calc-btn:active { background: #1f56c4; }
  .clear-btn {
    font-size: 28px;
    font-weight: 700;
    color: #fff;
    background: #8a97a3;
    border: none;
    border-radius: 12px;
    padding: 16px 28px;
    cursor: pointer;
    min-width: 130px;
  }
  .clear-btn:active { background: #6f7c88; }
  .result {
    margin-top: 18px;
    font-size: 36px;
    font-weight: 800;
    color: #d4380d;
    min-height: 44px;
    word-break: break-all;
    text-align: center;
    border: 3px solid #d4380d;
    border-radius: 14px;
    padding: 16px 12px;
    background: #fff7f3;
  }
  .result .unit { font-size: 28px; font-weight: 700; color: #d4380d; margin-left: 6px; }
  .result.hint { color: #b06a00; font-size: 24px; font-weight: 600; border-color: #e0a64a; background: #fffaf0; }
  footer {
    text-align: center;
    font-size: 18px;
    color: #8a97a3;
    margin-top: 20px;
  }

  /* 手机端：窄屏竖排 */
  @media (max-width: 600px) {
    body { padding: 16px 12px 48px; }
    h1 { font-size: 32px; }
    .sub { font-size: 18px; }
    .inputs { flex-direction: column; align-items: stretch; }
    .btn-group { width: 100%; }
    .btn-group .calc-btn, .btn-group .clear-btn { flex: 1 1 0; width: auto; min-width: 0; }
    .result { font-size: 32px; }
  }
</style>
</head>
<body>
  <h1>重量计算器</h1>
  <p class="sub">每行独立计算 · 单位自动换算（超过 100 视为克）</p>

  <div id="rows"></div>

  <footer>填写「包数」与「每包重量」，点「计算」即可得出该行重量（kg）</footer>

<script>
  // 显示全部小数位：先清除浮点误差（保留到 10 位小数），再去末尾多余的 0，不人为四舍五入
  function fmt(num) {
    if (!isFinite(num)) return '0';
    var cleaned = Math.round(num * 1e10) / 1e10;
    return cleaned.toString();
  }

  function calculate(row) {
    var nEl = row.querySelector('.pkg-count');
    var wEl = row.querySelector('.pkg-weight');
    var resEl = row.querySelector('.result');

    var n = parseFloat(nEl.value);
    var w = parseFloat(wEl.value);

    if (isNaN(n) || isNaN(w) || n < 0 || w < 0) {
      resEl.className = 'result hint';
      resEl.innerHTML = '请先填写正确的包数和重量';
      return;
    }

    // 每包重量 > 100 时，自动当作克（g），换算成千克
    var wKg = (w > 100) ? (w / 1000) : w;
    var total = n * wKg;

    resEl.className = 'result';
    resEl.innerHTML = fmt(total) + '<span class="unit">kg</span>';
  }

  function clearRow(row) {
    row.querySelector('.pkg-count').value = '';
    row.querySelector('.pkg-weight').value = '';
    var resEl = row.querySelector('.result');
    resEl.className = 'result';
    resEl.innerHTML = '';
  }

  // 生成固定的 5 行
  var container = document.getElementById('rows');
  for (var i = 1; i <= 5; i++) {
    var row = document.createElement('div');
    row.className = 'row';
    row.innerHTML =
      '<div class="row-title">第 ' + i + ' 行</div>' +
      '<div class="inputs">' +
        '<div class="field">' +
          '<label for="n' + i + '">包数（共几包）</label>' +
          '<input id="n' + i + '" class="pkg-count" type="number" inputmode="numeric" min="0" step="1" placeholder="例如 12">' +
        '</div>' +
        '<div class="field">' +
          '<label for="w' + i + '">每包重量</label>' +
          '<input id="w' + i + '" class="pkg-weight" type="number" inputmode="decimal" min="0" step="any" placeholder="例如 2.5 或 150">' +
        '</div>' +
        '<div class="btn-group">' +
          '<button class="calc-btn" type="button">计算</button>' +
          '<button class="clear-btn" type="button">清空</button>' +
        '</div>' +
      '</div>' +
      '<div class="result"></div>';
    container.appendChild(row);

    row.querySelector('.calc-btn').addEventListener('click', function () {
      calculate(this.closest('.row'));
    });
    row.querySelector('.clear-btn').addEventListener('click', function () {
      clearRow(this.closest('.row'));
    });
  }
</script>
</body>
</html>
